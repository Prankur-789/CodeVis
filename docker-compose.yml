# CodeVis - full-stack local deployment
#
# Not build-tested in this sandbox (no Docker available -- see
# backend/Dockerfile's note). Reviewed carefully; please verify with
# `docker compose up --build` in your own environment.
#
# Usage:
#   cp .env.example .env      # adjust if needed
#   docker compose up --build
#   open http://localhost:8080

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
